cosine_warmup: 50
lora_parameters: {rank: 64, dropout: 0.0, scale: 2.0}
mask_prompt: true
max_seq_length: 2048
grad_checkpoint: true
steps_per_report: 20
steps_per_eval: 100
val_batches: 25
save_every: 200
