# LoRA rank 64 on 1500 examples (rank 16 is n1500.yaml).
model: ibm-granite/granite-4.1-3b
seed: 0
epochs: 1
train_size: 1500
batch_size: 2
grad_accumulation_steps: 2
num_layers: -1
