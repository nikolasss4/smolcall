# Learning curve: same recipe as main.yaml on the first 500 train examples.
model: ibm-granite/granite-4.1-3b
seed: 0
epochs: 1
train_size: 500
batch_size: 2
grad_accumulation_steps: 2
num_layers: -1
learning_rate: 1.0e-4
cosine_warmup: 50
lora_parameters: {rank: 16, dropout: 0.0, scale: 2.0}
mask_prompt: true
max_seq_length: 2048
grad_checkpoint: true
steps_per_report: 20
steps_per_eval: 100
val_batches: 25
save_every: 200
