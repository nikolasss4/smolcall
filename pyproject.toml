[project]
name = "smolcall"
version = "0.1.0"
description = "LoRA fine-tuning a small open model for structured function calling on Apple Silicon, evaluated against frontier models."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=0.36",
    "typer>=0.12",
    "rich>=13.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# MLX only runs on Apple Silicon. CI on Linux installs without this extra.
mlx = [
    "mlx-lm>=0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
frontier = ["anthropic>=2.3"]
charts = ["matplotlib>=3.9"]
demo = ["gradio>=5.0"]

[project.scripts]
smolcall = "smolcall.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
packages = ["smolcall"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

# MLX is only installed on Apple Silicon; treat it as untyped everywhere so local and
# Linux CI type-check the same way.
[[tool.mypy.overrides]]
module = ["mlx", "mlx.*", "mlx_lm", "mlx_lm.*", "anthropic", "anthropic.*"]
follow_imports = "skip"
follow_untyped_imports = false
